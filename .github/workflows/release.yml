name: Release

'on':
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.6.1.'
            exit 1
          fi
          plutil -lint Resources/Info.plist
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match the app version $version. Update Resources/Info.plist before tagging."
            exit 1
          fi
          if [ "$(uname -m)" != arm64 ]; then
            echo '::error::This workflow publishes Apple Silicon builds and requires an arm64 runner.'
            exit 1
          fi

      - name: Validate signing configuration
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        run: |
          for secret_name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD CODE_SIGN_IDENTITY; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing repository secret: $secret_name. See docs/DEVELOPMENT.md."
              exit 1
            fi
          done
          if [ "$CODE_SIGN_IDENTITY" = '-' ]; then
            echo '::error::CODE_SIGN_IDENTITY must identify a fixed signing certificate.'
            exit 1
          fi

      - name: Run tests
        run: ./scripts/test.sh

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          umask 077
          certificate_file="$RUNNER_TEMP/openpaste-signing.p12"
          keychain_file="$RUNNER_TEMP/openpaste-signing.keychain-db"
          trap 'rm -f "$certificate_file"' EXIT
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_file"
          security create-keychain -p "$keychain_password" "$keychain_file"
          security set-keychain-settings -lut 21600 "$keychain_file"
          security unlock-keychain -p "$keychain_password" "$keychain_file"
          security import "$certificate_file" -k "$keychain_file" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -x >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_file" >/dev/null

      - name: Build signed app
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          CODE_SIGN_KEYCHAIN: ${{ runner.temp }}/openpaste-signing.keychain-db
        run: ./scripts/build.sh

      - name: Verify signing identity across versions
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          CODE_SIGN_KEYCHAIN: ${{ runner.temp }}/openpaste-signing.keychain-db
        run: ./scripts/test-signing.sh

      - name: Package and verify release files
        run: |
          ./scripts/package-release.sh
          (cd release && shasum -a 256 -c SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "release/OpenPaste-$version.dmg" \
            "release/OpenPaste-$version.zip" \
            release/SHA256SUMS.txt \
            --verify-tag \
            --title "OpenPaste $RELEASE_TAG" \
            --generate-notes \
            --notes 'Apple Silicon (arm64), macOS 13+. Intel is not included. This build is signed but is not Apple-notarized.'

      - name: Remove signing material
        if: ${{ always() }}
        run: |
          keychain_file="$RUNNER_TEMP/openpaste-signing.keychain-db"
          if [ -f "$keychain_file" ]; then
            security delete-keychain "$keychain_file"
          fi
          rm -f "$RUNNER_TEMP/openpaste-signing.p12"
