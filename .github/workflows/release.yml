name: Release

'on':
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_SIGNING_MODE: ${{ vars.RELEASE_SIGNING_MODE || 'self-signed' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.6.1.'
            exit 1
          fi
          plutil -lint Resources/Info.plist
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match the app version $version. Update Resources/Info.plist before tagging."
            exit 1
          fi
          if [ "$(uname -m)" != arm64 ]; then
            echo '::error::This workflow publishes Apple Silicon builds and requires an arm64 runner.'
            exit 1
          fi

      - name: Validate signing configuration
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          case "$RELEASE_SIGNING_MODE" in
            self-signed|developer-id) ;;
            *) echo '::error::RELEASE_SIGNING_MODE must be self-signed or developer-id.'; exit 1 ;;
          esac
          required_secrets=(BUILD_CERTIFICATE_BASE64 P12_PASSWORD CODE_SIGN_IDENTITY)
          if [ "$RELEASE_SIGNING_MODE" = developer-id ]; then
            required_secrets+=(APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD)
          fi
          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing repository secret: $secret_name. See docs/DEVELOPMENT.md."
              exit 1
            fi
          done
          if [ "$CODE_SIGN_IDENTITY" = '-' ]; then
            echo '::error::CODE_SIGN_IDENTITY must identify a fixed signing certificate.'
            exit 1
          fi
          if [ "$RELEASE_SIGNING_MODE" = developer-id ] && [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo '::error::APPLE_TEAM_ID must contain 10 uppercase letters/digits.'
            exit 1
          fi

      - name: Run tests
        run: ./scripts/test.sh

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        run: |
          umask 077
          certificate_file="$RUNNER_TEMP/openpaste-signing.p12"
          keychain_file="$RUNNER_TEMP/openpaste-signing.keychain-db"
          ca_dir="$(mktemp -d "$RUNNER_TEMP/openpaste-ca.XXXXXX")"
          trap 'rm -f "$certificate_file"; rm -rf "$ca_dir"' EXIT
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_file"
          security create-keychain -p "$keychain_password" "$keychain_file"
          security set-keychain-settings -lut 21600 "$keychain_file"
          security unlock-keychain -p "$keychain_password" "$keychain_file"
          if [ "$RELEASE_SIGNING_MODE" = developer-id ]; then
            # Include Apple's intermediates even when the exported P12 contains only the leaf.
            for ca_name in DeveloperIDCA DeveloperIDG2CA; do
              curl --fail --silent --show-error --location --retry 3 \
                "https://www.apple.com/certificateauthority/$ca_name.cer" -o "$ca_dir/$ca_name.cer"
              security import "$ca_dir/$ca_name.cer" -k "$keychain_file" >/dev/null
            done
          fi
          security import "$certificate_file" -k "$keychain_file" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -x >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_file" >/dev/null
          # codesign resolves identities through the user keychain search list.
          security list-keychains -d user -s "$keychain_file"
          if [ "$RELEASE_SIGNING_MODE" = developer-id ]; then
            identities="$(security find-identity -v -p codesigning "$keychain_file")"
            if ! printf '%s\n' "$identities" | grep -Fi -- "$CODE_SIGN_IDENTITY" | grep -Fq '"Developer ID Application:'; then
              echo '::error::A valid Apple-issued Developer ID Application identity matching CODE_SIGN_IDENTITY is required. Replace the old self-signed P12 and its password together.'
              exit 1
            fi
          else
            identities="$(security find-identity -p codesigning "$keychain_file")"
            if ! printf '%s\n' "$identities" | grep -Fqi -- "$CODE_SIGN_IDENTITY"; then
              echo '::error::CODE_SIGN_IDENTITY does not match the certificate/private key in BUILD_CERTIFICATE_BASE64.'
              exit 1
            fi
          fi

      - name: Build signed app
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          CODE_SIGN_KEYCHAIN: ${{ runner.temp }}/openpaste-signing.keychain-db
          CODE_SIGN_MODE: ${{ env.RELEASE_SIGNING_MODE == 'developer-id' && 'developer-id' || 'development' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/build.sh

      - name: Verify signing identity across versions
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          CODE_SIGN_KEYCHAIN: ${{ runner.temp }}/openpaste-signing.keychain-db
          CODE_SIGN_MODE: ${{ env.RELEASE_SIGNING_MODE == 'developer-id' && 'developer-id' || 'development' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/test-signing.sh

      - name: Notarize and staple app
        if: ${{ env.RELEASE_SIGNING_MODE == 'developer-id' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python3 scripts/notarize-release.py app build/OpenPaste.app

      - name: Package and verify release files
        run: |
          ./scripts/package-release.sh
          (cd release && shasum -a 256 -c SHA256SUMS.txt)

      - name: Sign, notarize and staple DMG
        if: ${{ env.RELEASE_SIGNING_MODE == 'developer-id' }}
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          CODE_SIGN_KEYCHAIN: ${{ runner.temp }}/openpaste-signing.keychain-db
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          python3 scripts/notarize-release.py dmg "release/OpenPaste-$version.dmg"
          # Stapling changes the DMG bytes. Hash the final, stapled deliverables.
          (cd release && shasum -a 256 "OpenPaste-$version.dmg" "OpenPaste-$version.zip") > release/SHA256SUMS.txt
          (cd release && shasum -a 256 -c SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [ "$RELEASE_SIGNING_MODE" = developer-id ]; then
            notes='Apple Silicon (arm64), macOS 13+. Intel is not included. Signed with Developer ID and notarized by Apple; the app and DMG include stapled notarization tickets.'
          else
            notes='Apple Silicon (arm64), macOS 13+. Intel is not included. Signed with a fixed self-signed certificate; not notarized by Apple. If macOS blocks opening, follow the Open Anyway instructions in README: https://github.com/Junp0/OpenPaste#快速开始'
          fi
          gh release create "$RELEASE_TAG" \
            "release/OpenPaste-$version.dmg" \
            "release/OpenPaste-$version.zip" \
            release/SHA256SUMS.txt \
            --verify-tag \
            --title "OpenPaste $RELEASE_TAG" \
            --generate-notes \
            --notes "$notes"

      - name: Remove signing material
        if: ${{ always() }}
        run: |
          keychain_file="$RUNNER_TEMP/openpaste-signing.keychain-db"
          if [ -f "$keychain_file" ]; then
            security delete-keychain "$keychain_file"
          fi
          rm -f "$RUNNER_TEMP/openpaste-signing.p12"
