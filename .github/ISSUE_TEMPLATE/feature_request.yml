name: Feature request / 功能建议
description: 描述使用场景和希望解决的问题。
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 目前的工作流遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案（可选）
